services:
  misa-runner:
    build: .
    ports:
      - "3050:3050"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PLAYWRIGHT_HEADLESS: "0"
      MAX_CONCURRENT_RUNS: "3"
      PORT: "3050"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./browser_profiles:/app/browser_profiles
    restart: unless-stopped
    shm_size: "2gb"
